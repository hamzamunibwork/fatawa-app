plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abdulhasib.fatawa'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abdulhasib.fatawa'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // مفتاح توقيع ثابت وسري: لا يُحفظ في المستودع، بل في «أسرار» GitHub (Secrets)،
    // ويضعه البناء التلقائي في ملف مؤقت. فكل نسخة جديدة تُثبَّت فوق القديمة دون حذفها.
    signingConfigs {
        fw {
            def ks = System.getenv('FW_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('FW_KEY_PASSWORD')
                keyAlias 'fatawa'
                keyPassword System.getenv('FW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('FW_KEYSTORE')) signingConfig signingConfigs.fw
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
