name: بناء تطبيق أندرويد — الفتاوى الميسّرة

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # لنشر ملف التطبيق في «الإصدارات» (Releases)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (from repository secrets)
        env:
          FW_KEYSTORE_B64: ${{ secrets.FW_KEYSTORE_B64 }}
        run: |
          if [ -z "$FW_KEYSTORE_B64" ]; then echo "::error::لم يُضف السر FW_KEYSTORE_B64 في إعدادات المستودع"; exit 1; fi
          echo "$FW_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fw.keystore"

      - name: Build APK
        env:
          FW_KEYSTORE: ${{ runner.temp }}/fw.keystore
          FW_KEY_PASSWORD: ${{ secrets.FW_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fatawa-muyassara.apk

      # ملف التطبيق يُنشر في «الإصدارات» (Releases): مساحتها منفصلة عن مساحة Actions فلا تمتلئ
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "الفتاوى الميسّرة — ${{ github.event.head_commit.message || 'تشغيل يدوي' }} (${{ github.run_number }})"
          files: fatawa-muyassara.apk
          make_latest: true
